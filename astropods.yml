# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: package/v1
name: nextgig
meta: {}

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
  inputs:
    - name: RESEND_API_KEY
      datatype: string
      secret: true
      optional: true
      description: Resend API key (re_…). Get one free at resend.com. Optional — can be set in-app instead.
    - name: RESEND_FROM
      datatype: string
      secret: false
      optional: true
      description: 'From address, e.g. "NextGig <jobs@yourdomain.com>". Defaults to onboarding@resend.dev (verify a domain in Resend to email arbitrary recipients).'

models:
  default:
    provider: gateway
    models: [gpt-5-6-luna]

knowledge:
  db:
    provider: postgres

dev:
  interfaces:
    frontend:
      port: 80

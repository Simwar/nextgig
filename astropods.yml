# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: package/v1
name: nextgig
meta: {}

agent:
  build:
    context: .
    dockerfile: Dockerfile
  # Astro AI Gateway: injects ASTRO_GATEWAY_URL + ASTRO_GATEWAY_API_KEY (managed
  # per-tenant key, no provider key to bring). The model runs through the gateway
  # (OpenAI-compat) and job search is the gateway's server-side MCP `web_search`
  # tool (executed gateway-side by Bifrost). See docs/ai-gateway.md.
  astro_ai_gateway: true
  # Custom chat frontend on port 80 (agent/webserver.ts). No messaging sidecar:
  # the frontend and scheduler drive the agent in-process via agent.generate().
  interfaces:
    frontend: true
  inputs:
    # Email delivery for scheduled job-match digests, via Resend.
    # Optional — email can also be configured at runtime from the app's ⚙ Settings
    # panel (stored in ./data). This env var, when set, takes precedence.
    - name: RESEND_API_KEY
      datatype: string
      secret: true
      optional: true
      description: Resend API key (re_…). Get one free at resend.com. Optional — can be set in-app instead.
    - name: RESEND_FROM
      datatype: string
      secret: false
      optional: true
      description: 'From address, e.g. "NextGig <jobs@yourdomain.com>". Defaults to onboarding@resend.dev (verify a domain in Resend to email arbitrary recipients).'

# No `models:` block — the gateway provides the model (zero provider keys).
# For local dev WITHOUT the gateway, set ANTHROPIC_API_KEY and the agent falls
# back to direct Anthropic (with native web_search) automatically.

dev:
  interfaces:
    frontend:
      port: 80

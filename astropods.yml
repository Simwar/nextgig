# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: package/v1
name: nextgig
meta: {}

agent:
  build:
    context: .
    dockerfile: Dockerfile
  # Custom chat frontend on port 80 (agent/webserver.ts). No messaging sidecar:
  # the frontend and scheduler drive the agent in-process via agent.generate().
  interfaces:
    frontend: true
  inputs:
    # Email delivery for scheduled job-match digests, via Resend.
    # Optional — email can also be configured at runtime from the app's ⚙ Settings
    # panel (stored in the db knowledge store). This env var, when set, takes precedence.
    - name: RESEND_API_KEY
      datatype: string
      secret: true
      optional: true
      description: Resend API key (re_…). Get one free at resend.com. Optional — can be set in-app instead.
    - name: RESEND_FROM
      datatype: string
      secret: false
      optional: true
      description: 'From address, e.g. "NextGig <jobs@yourdomain.com>". Defaults to onboarding@resend.dev (verify a domain in Resend to email arbitrary recipients).'

models:
  # Astro AI Gateway — managed model access, no provider API key to bring.
  # The platform injects ASTRO_GATEWAY_URL + ASTRO_GATEWAY_API_KEY at runtime and
  # the model picked from the list below is injected as MODEL_DEFAULT.
  # Web search (with page open/fetch) is the gateway's server-side web_search
  # tool, which needs one of the GPT-5.x models. See docs/ai-gateway.md.
  default:
    provider: gateway
    models: [gpt-5-6-luna]

knowledge:
  # Postgres sidecar, deployed alongside the agent. Provider-mode entries always
  # get a persistent volume, so the skill matrix, preferences, application
  # history, and chat memory survive a restart or redeploy — the agent's own
  # container filesystem does not (there is no volume option for the agent).
  # The platform generates a managed user + random password and injects
  # POSTGRES_HOST / PORT / USER / PASSWORD / DB (see agent/storage.ts).
  db:
    provider: postgres

dev:
  interfaces:
    frontend:
      port: 80
